<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kabin Kokpiti</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:'Space Mono',monospace;overflow-x:hidden}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes eqPulse{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

.cockpit-shell{display:flex;flex-direction:column;width:100%;min-height:100vh;min-height:100dvh;padding:10px;padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(10px + env(safe-area-inset-bottom));gap:10px}
.widgets-col{display:flex;flex-direction:column;gap:10px}

/* HAVA & YOL WIDGET */
.weather-widget{font-family:'Inter',sans-serif;background:#0d0e11;border:1px solid #27272a;border-radius:20px;overflow:hidden;animation:slideIn .3s ease both}
.w-slate{background:linear-gradient(160deg,#b4c5ce 0%,#9eb1bc 100%);color:#0f172a;padding:12px 14px 10px 14px;border-bottom-left-radius:16px;border-bottom-right-radius:16px}
.w-search{display:flex;gap:5px;margin-bottom:6px}
.w-search button{background:rgba(15,23,42,.14);color:#0f172a;border:none;border-radius:6px;padding:4px 8px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;cursor:pointer}
.w-search input{flex:1;min-width:0;background:rgba(255,255,255,.5);border:none;border-radius:6px;padding:4px 8px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:#0f172a;outline:none}
.w-hero{display:flex;justify-content:space-between;align-items:center}
.w-temp{font-size:40px;font-weight:800;line-height:1;letter-spacing:-2px;color:#090d16}
.w-city{font-size:14px;font-weight:700;margin-top:2px}
.w-meta{font-size:10px;font-weight:600;color:#1e293b;margin-top:2px}
.w-hourly{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:8px;padding-top:6px;border-top:1px solid rgba(15,23,42,.12);text-align:center;font-size:10px;font-weight:700}
.w-bottom-bar{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:#e4e4e7}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px}

/* TEENAGE ENGINEERING TARZI RADYO WIDGET (IMG_1309) */
.te-radio{background:linear-gradient(180deg,#262729 0%,#18191b 100%);border:1px solid #38393d;border-radius:20px;padding:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 25px rgba(0,0,0,.7);animation:slideIn .35s ease both}
.te-screen{background:#101113;border:1px solid #09090b;border-radius:12px;padding:10px 12px;box-shadow:inset 0 2px 8px rgba(0,0,0,.9)}
.te-top-meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1px}
.te-track{color:#f59e0b;font-weight:700;text-transform:uppercase}
.te-bitrate{color:#71717a;font-size:9px}
.te-mid-row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.te-play-ind{font-size:12px;color:#e4e4e7}
.te-clock{font-size:32px;font-weight:400;letter-spacing:2px;color:#f4f4f5;line-height:1}
.te-sub-row{display:flex;justify-content:space-between;font-size:9px;color:#71717a;margin-bottom:6px}
.te-sub-row span.live-tag{color:#34d399}
.te-progress{height:2px;background:#27272a;position:relative;margin-bottom:8px}
.te-progress-fill{width:62%;height:100%;background:#f59e0b}
.te-eq{display:flex;align-items:flex-end;justify-content:space-between;height:26px;gap:3px;padding-top:4px;border-top:1px dashed #27272a}
.eq-bar{flex:1;background:repeating-linear-gradient(to top,#d4d4d8 0px,#d4d4d8 2px,transparent 2px,transparent 4px);height:100%;transform-origin:bottom;transform:scaleY(.2);transition:transform .2s}
.te-radio.playing .eq-bar{animation:eqPulse .7s ease-in-out infinite}
.te-radio.playing .eq-bar:nth-child(odd){animation-duration:.55s}
.te-radio.playing .eq-bar:nth-child(3n){animation-duration:.85s}
.te-radio.playing .eq-bar:nth-child(4n){animation-duration:.45s}

.te-slider-row{display:flex;align-items:center;gap:8px;margin:10px 2px}
.te-led{width:26px;height:6px;border-radius:4px;background:#27272a;transition:background .2s,box-shadow .2s}
.te-radio.playing .te-led{background:#10b981;box-shadow:0 0 10px #10b981}
.te-rail{flex:1;height:4px;background:#0c0c0e;border-radius:2px;position:relative}
.te-knob{width:14px;height:10px;background:#52525b;border-radius:3px;position:absolute;top:-3px;right:18px}

.te-controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.te-btn{aspect-ratio:1/1;max-height:44px;width:100%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#323337,#1c1d20);border:1px solid #111113;box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);color:#d4d4d8;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.te-btn:active{transform:scale(.92);background:#141416;color:#f59e0b}
.te-btn.active-btn{color:#10b981;border-color:#10b981}

/* SAĞ: SİYAH-BEYAZ ŞERİT MENÜ */
.stacked-menu{display:flex;flex-direction:column;flex:1;border-radius:20px;overflow:hidden;border:1px solid #1f1f22}
.menu-strip{flex:1;display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 22px;border:none;border-bottom:1px solid #1a1a1d;text-align:left;text-decoration:none;color:#fff;font-family:'Space Mono',monospace;font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:background-color .15s,padding-left .15s}
.menu-strip:nth-child(1){background:#070709}
.menu-strip:nth-child(2){background:#0d0d10}
.menu-strip:nth-child(3){background:#131317}
.menu-strip:nth-child(4){background:#19191f;border-bottom:none}
.menu-strip:active{background:#fff!important;color:#000!important;padding-left:30px}
.menu-strip:active svg{stroke:#000}
.strip-left{display:flex;align-items:center;gap:16px}
.menu-strip svg{width:21px;height:21px;stroke:#fff;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.strip-badge{font-size:10px;letter-spacing:1.2px;color:#a1a1aa;background:rgba(255,255,255,.06);padding:4px 7px;border-radius:6px}

/* MODALLAR */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100;padding:16px;padding-top:calc(14px + env(safe-area-inset-top));overflow-y:auto}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #27272a}
.header-bar h2{margin:0;font-size:15px;letter-spacing:3px;text-transform:uppercase}
.back-btn{background:#fff;color:#000;border:none;padding:10px 18px;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;letter-spacing:2px;cursor:pointer;border-radius:8px}
.box{background:#0c0c0e;border:1px solid #27272a;padding:16px;margin-bottom:14px;border-radius:14px}
.tacho-display{font-size:40px;font-weight:700;text-align:center;letter-spacing:3px;margin:12px 0;color:#fff}
.btn-row{display:flex;gap:10px}
.btn-row button{flex:1;padding:14px;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;letter-spacing:1.5px;border-radius:10px;cursor:pointer;border:1px solid #3f3f46}
.touchpad-container{display:flex;gap:10px;margin-bottom:15px}
#touchpad-area{flex:1;height:180px;background:#050505;border:1px solid #3f3f46;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a1a1aa;font-size:12px;text-align:center;user-select:none;touch-action:none}
.scroll-panel{width:64px;display:flex;flex-direction:column;gap:10px}
.scroll-btn{flex:1;background:#121215;color:#fff;border:1px solid #3f3f46;border-radius:10px;font-size:20px;font-weight:bold;cursor:pointer}
input.modal-inp{width:100%;padding:12px;background:#000;border:1px solid #3f3f46;color:#fff;font-family:'Space Mono',monospace;font-size:13px;border-radius:8px}

/* YATAY EKRAN (ASUS MONİTÖR 16:9) */
@media screen and (orientation:landscape){
html,body{overflow:hidden}
.cockpit-shell{flex-direction:row;height:100vh;height:100dvh;padding:10px 14px;gap:12px}
.widgets-col{width:350px;flex-shrink:0;height:100%;justify-content:space-between}
.stacked-menu{flex:1;height:100%}
.menu-strip{padding:0 28px;font-size:16px;letter-spacing:4px}
}
</style>
</head>
<body>
<div class="cockpit-shell">

<!-- SOL KOLON: HAVA WIDGET + TEENAGE ENGINEERING RADYO WIDGET -->
<div class="widgets-col">
<!-- 1. HAVA & YOL WIDGET -->
<div class="weather-widget">
<div class="w-slate">
<div class="w-search">
<button type="button" onclick="loadGPSWeather()">📍 GPS</button>
<input type="text" id="citySearchInput" placeholder="Şehir ara..." onkeydown="if(event.key==='Enter')searchCityWeather()">
<button type="button" onclick="searchCityWeather()">ARA</button>
</div>
<div class="w-hero">
<div>
<div class="w-temp" id="w-main-temp">--°</div>
<div class="w-city" id="w-city-title">Konum Alınıyor...</div>
<div class="w-meta" id="w-hi-lo">Y: --° D: --° &nbsp; ↗ -- km/s</div>
</div>
<div style="font-size:38px" id="w-main-icon">⛅</div>
</div>
<div class="w-hourly" id="w-hourly-grid"></div>
</div>
<div class="w-bottom-bar">
<span id="w-road-risk">Yol: Güvenli <span class="dot" style="background:#22c55e"></span></span>
<span id="w-humidity-vis">Nem: --% 💧</span>
</div>
</div>

<!-- 2. TEENAGE ENGINEERING TARZI RADYO WIDGET -->
<div class="te-radio" id="teRadioBox">
<div class="te-screen">
<div class="te-top-meta">
<span class="te-track" id="te-station-name">1. NIGHTRIDE FM</span>
<span class="te-bitrate">MP3 128K</span>
</div>
<div class="te-mid-row">
<span class="te-play-ind" id="te-state-icon">⏸</span>
<span class="te-clock" id="te-live-clock">00:00</span>
</div>
<div class="te-sub-row">
<span>CH 01/04</span>
<span class="live-tag" id="te-status-label">HAZIR</span>
</div>
<div class="te-progress"><div class="te-progress-fill"></div></div>
<div class="te-eq" id="te-eq-bars"></div>
</div>
<div class="te-slider-row">
<div class="te-led"></div>
<div class="te-rail"><div class="te-knob"></div></div>
</div>
<div class="te-controls">
<button type="button" class="te-btn" onclick="prevStation()" title="Önceki Kanal">⏮</button>
<button type="button" class="te-btn" id="btn-play" onclick="playRadio()" title="Oynat">▶</button>
<button type="button" class="te-btn" onclick="pauseRadio()" title="Duraklat">⏸</button>
<button type="button" class="te-btn" onclick="stopRadio()" title="Durdur">⏹</button>
<button type="button" class="te-btn" onclick="nextStation()" title="Sonraki Kanal">⏭</button>
</div>
<audio id="synthRadio" preload="none" src="https://stream.nightride.fm/nightride.mp3"></audio>
</div>
</div>

<!-- SAĞ KOLON: SİYAH-BEYAZ ŞERİT MENÜ -->
<div class="stacked-menu">
<a href="https://debridui.com" target="_blank" class="menu-strip">
<div class="strip-left">
<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
<span>DEBRIDUI</span>
</div>
<span class="strip-badge">MEDYA</span>
</a>

<button type="button" onclick="openModal('tacho-modal')" class="menu-strip">
<div class="strip-left">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
<span>TAKOGRAF</span>
</div>
<span class="strip-badge" id="home-tacho-badge">04:30</span>
</button>

<a href="https://www.google.com/maps" target="_blank" class="menu-strip">
<div class="strip-left">
<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
<span>HARİTA</span>
</div>
<span class="strip-badge">MAPS ↗</span>
</a>

<button type="button" onclick="openModal('touchpad-modal')" class="menu-strip">
<div class="strip-left">
<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="7"></rect><line x1="12" y1="6" x2="12" y2="10"></line></svg>
<span>TOUCHPAD</span>
</div>
<span class="strip-badge">KUMANDA</span>
</button>
</div>
</div>

<!-- TAKOGRAF MODAL -->
<div id="tacho-modal" class="modal">
<div class="header-bar"><h2>SÜRÜŞ & MOLA TAKİBİ</h2><button type="button" class="back-btn" onclick="closeModal('tacho-modal')">GERİ</button></div>
<div class="box" style="text-align:center">
<div style="font-size:11px;letter-spacing:2px;color:#a1a1aa" id="tacho-mode-label">4.5 SAAT KESİNTİSİZ SÜRÜŞ LİMİTİ</div>
<div class="tacho-display" id="tacho-timer">04:30:00</div>
<div class="btn-row">
<button type="button" onclick="startTacho(270,'SÜRÜŞ SÜRESİ (4.5 SAAT)')" style="background:#fff;color:#000">▶ SÜRÜŞ BAŞLAT</button>
<button type="button" onclick="startTacho(45,'ZORUNLU MOLA (45 DK)')" style="background:#18181b;color:#fff">☕ 45 DK MOLA</button>
</div>
<div class="btn-row" style="margin-top:10px">
<button type="button" onclick="pauseTacho()" style="background:#121215;color:#a1a1aa">⏸ DURAKLAT</button>
<button type="button" onclick="resetTacho()" style="background:#121215;color:#ef4444">↺ SIFIRLA</button>
</div>
</div>
</div>

<!-- TOUCHPAD MODAL -->
<div id="touchpad-modal" class="modal">
<div class="header-bar"><h2>TOUCHPAD</h2><button type="button" class="back-btn" onclick="closeModal('touchpad-modal')">GERİ</button></div>
<div class="box">
<div class="touchpad-container">
<div id="touchpad-area"><strong>İMLEÇ ALANI</strong><p style="font-size:10px;color:#71717a">PARMAĞINIZI GEZDİRİN</p></div>
<div class="scroll-panel">
<button type="button" class="scroll-btn">▲</button>
<button type="button" class="scroll-btn">▼</button>
</div>
</div>
<div style="display:flex;gap:8px">
<input type="text" id="remoteInput" class="modal-inp" placeholder="YAZI YAZIN...">
<button type="button" class="back-btn" onclick="sendText()">GÖNDER</button>
</div>
</div>
</div>

<script>
function openModal(id){document.getElementById(id).style.display='block'}
function closeModal(id){document.getElementById(id).style.display='none'}

/* Ekolayzır Çubuklarını Oluştur & Canlı Saat */
const eqContainer=document.getElementById('te-eq-bars');
for(let i=0;i<22;i++){const b=document.createElement('div');b.className='eq-bar';eqContainer.appendChild(b)}
function updateClock(){
const now=new Date();
document.getElementById('te-live-clock').innerText=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
}
setInterval(updateClock,1000);updateClock();

/* Radyo Kontrolleri */
const stations=[
{name:'1. NIGHTRIDE FM',url:'https://stream.nightride.fm/nightride.mp3'},
{name:'2. DARKSYNTH',url:'https://stream.nightride.fm/darksynth.mp3'},
{name:'3. CYBERPUNK',url:'https://ice2.somafm.com/defcon-128-mp3'},
{name:'4. SPACE AMBIENT',url:'https://ice2.somafm.com/spacestation-128-mp3'}
];
let curSt=0;
const audio=document.getElementById('synthRadio'),teBox=document.getElementById('teRadioBox');

function loadStation(idx,autoPlay){
curSt=(idx+stations.length)%stations.length;
document.getElementById('te-station-name').innerText=stations[curSt].name;
document.querySelector('.te-sub-row span').innerText=`CH 0${curSt+1}/04`;
audio.pause();audio.src=stations[curSt].url;
if(autoPlay)playRadio();
}
function nextStation(){loadStation(curSt+1,true)}
function prevStation(){loadStation(curSt-1,true)}
function playRadio(){
document.getElementById('te-status-label').innerText='BAĞLANIYOR...';
audio.play().then(()=>{
teBox.classList.add('playing');
document.getElementById('te-state-icon').innerText='▶';
document.getElementById('te-status-label').innerText='CANLI YAYIN';
document.getElementById('btn-play').classList.add('active-btn');
}).catch(()=>{
document.getElementById('te-status-label').innerText='TEKRAR BAS';
});
}
function pauseRadio(){
audio.pause();teBox.classList.remove('playing');
document.getElementById('te-state-icon').innerText='⏸';
document.getElementById('te-status-label').innerText='DURAKLATILDI';
document.getElementById('btn-play').classList.remove('active-btn');
}
function stopRadio(){
audio.pause();audio.currentTime=0;teBox.classList.remove('playing');
document.getElementById('te-state-icon').innerText='⏹';
document.getElementById('te-status-label').innerText='DURDURULDU';
document.getElementById('btn-play').classList.remove('active-btn');
}

/* Hava Durumu */
function getWeatherIcon(c){if(c===0)return'☀️';if(c<=3)return'⛅';if(c<=48)return'🌫️';if(c<=67)return'🌧️';if(c<=77)return'❄️';return'⛈️'}
async function fetchRichWeather(lat,lon,label){
document.getElementById('w-city-title').innerText=label;
try{
const d=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`)).json();
const t=Math.round(d.current.temperature_2m),ws=Math.round(d.current.wind_speed_10m);
document.getElementById('w-main-temp').innerText=t+'°';
document.getElementById('w-main-icon').innerText=getWeatherIcon(d.current.weather_code);
document.getElementById('w-hi-lo').innerText=`Y: ${Math.round(d.daily.temperature_2m_max[0])}° D: ${Math.round(d.daily.temperature_2m_min[0])}°  ↗ ${ws} km/s`;
document.getElementById('w-humidity-vis').innerText=`Nem: %${d.current.relative_humidity_2m} 💧`;
document.getElementById('w-road-risk').innerHTML=t<=2?'Buzlanma Riski <span class="dot" style="background:#ef4444"></span>':(ws>=45?'Rüzgar Dikkat <span class="dot" style="background:#eab308"></span>':'Yol: Güvenli <span class="dot" style="background:#22c55e"></span>');
const hrNow=new Date().getHours();let h='';
for(let i=0;i<5;i++){const idx=hrNow+(i*2);if(d.hourly.time[idx])h+=`<div><div>${d.hourly.time[idx].slice(11,13)}</div><div>${getWeatherIcon(d.hourly.weather_code[idx])}</div><div>${Math.round(d.hourly.temperature_2m[idx])}°</div></div>`}
document.getElementById('w-hourly-grid').innerHTML=h;
}catch(e){document.getElementById('w-city-title').innerText='Hata'}
}
function loadGPSWeather(){
if(!navigator.geolocation){fetchRichWeather(36.65,29.12,'Fethiye');return}
navigator.geolocation.getCurrentPosition(p=>fetchRichWeather(p.coords.latitude,p.coords.longitude,`GPS (${p.coords.latitude.toFixed(2)}, ${p.coords.longitude.toFixed(2)})`),()=>fetchRichWeather(36.65,29.12,'Fethiye'));
}
async function searchCityWeather(){
const q=document.getElementById('citySearchInput').value.trim();if(!q)return;
try{const g=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=tr&format=json`)).json();if(g.results&&g.results.length)fetchRichWeather(g.results[0].latitude,g.results[0].longitude,g.results[0].name)}catch(e){}
}
window.addEventListener('load',loadGPSWeather);

/* Takograf */
let tachoSec=270*60,tachoInt=null;
function renderTacho(){
const h=String(Math.floor(tachoSec/3600)).padStart(2,'0'),m=String(Math.floor((tachoSec%3600)/60)).padStart(2,'0'),s=String(tachoSec%60).padStart(2,'0');
document.getElementById('tacho-timer').innerText=`${h}:${m}:${s}`;document.getElementById('home-tacho-badge').innerText=`${h}:${m}`;
}
function startTacho(mins,label){clearInterval(tachoInt);tachoSec=mins*60;document.getElementById('tacho-mode-label').innerText=label;renderTacho();tachoInt=setInterval(()=>{if(tachoSec>0){tachoSec--;renderTacho()}else{clearInterval(tachoInt);alert('SÜRE DOLDU KAPTAN!')}},1000)}
function pauseTacho(){clearInterval(tachoInt)}
function resetTacho(){clearInterval(tachoInt);tachoSec=270*60;renderTacho()}
function sendText(){const v=document.getElementById('remoteInput').value;if(v){alert("GÖNDERİLDİ: "+v);document.getElementById('remoteInput').value=''}}
</script>
</body>
</html>
