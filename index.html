<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Fleet & Vehicle Telemetry OS</title>
  <style>
    :root {
      --bg-base: #0d0e11;
      --bg-card: #16181d;
      --bg-card-elevated: #1e2128;
      --bg-pill: #23262f;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-active: rgba(255, 255, 255, 0.18);
      --text-primary: #f2f4f8;
      --text-secondary: #8c92a0;
      --text-muted: #565b68;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Inter, sans-serif;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding: 12px 16px;
      gap: 12px;
      background: radial-gradient(circle at 85% 15%, #1c2029 0%, #0d0e11 55%);
    }

    /* Üst Navigasyon Barı */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      letter-spacing: -1px;
      font-size: 14px;
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    .nav-tab {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      background: transparent;
    }

    .nav-tab.active {
      background: var(--bg-pill);
      color: var(--text-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .dot.green { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
    .dot.red { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }

    .btn-fullscreen {
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--text-primary);
      color: #0d0e11;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-fullscreen:active {
      transform: scale(0.96);
    }

    /* Ana Grid Yapısı */
    .main-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    /* Sol Sütun: Telemetri + Grafik + Alt Araç Kartları */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    /* Üst Hap Sayaçlar */
    .pill-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      flex-shrink: 0;
    }

    .mini-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .mini-pill span:first-child {
      font-weight: 600;
      color: var(--text-primary);
    }
    .mini-pill span:last-child {
      color: var(--text-secondary);
      font-size: 11px;
    }

    /* Hız ve Motor Durum Kartları */
    .kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
    }

    .kpi-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 86px;
    }

    .kpi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .kpi-body {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .kpi-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .kpi-value {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }

    .kpi-unit {
      font-size: 13px;
      color: var(--text-muted);
      margin-left: 4px;
    }

    /* Orta Grafik Kartı (Operational Efficiency / Speed History) */
    .chart-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 135px;
    }

    .chart-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .chart-title {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .chart-big-num {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .chart-big-num span {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .chart-canvas-wrap {
      width: 100%;
      height: 85px;
      position: relative;
    }

    canvas#telemetryChart {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Alt İkili Araç / Sensör Kartları */
    .bottom-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: 155px;
      flex-shrink: 0;
    }

    .vehicle-card {
      background: linear-gradient(145deg, #242832 0%, #16181d 65%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .vehicle-card.dark {
      background: var(--bg-card);
    }

    .vc-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .vc-title {
      font-size: 14px;
      font-weight: 600;
    }

    .vc-sub {
      font-size: 10px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .vc-arrow {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .truck-schematic {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 0;
    }

    .vc-badges {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-subtle);
      padding-top: 8px;
    }

    /* Sağ Sütun: Canlı Rota Haritası + Radyo + Hava Durumu */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .map-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 70% 35%, rgba(59, 130, 246, 0.12), transparent 55%),
        linear-gradient(180deg, #171a21 0%, #121419 100%);
      position: relative;
    }

    .map-overlay-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .map-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .route-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.75;
      pointer-events: none;
    }

    .map-bottom-bar {
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
    }

    .info-box {
      background: rgba(22, 24, 29, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 12px;
      flex: 1;
    }

    .info-box-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-box-val {
      font-size: 15px;
      font-weight: 600;
      margin-top: 3px;
    }

    /* Radyo ve Medya Kontrol Kartı */
    .media-card {
      height: 92px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .media-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .media-tag {
      font-size: 10px;
      color: var(--accent-green);
      font-weight: 600;
      letter-spacing: 0.6px;
    }

    .media-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .media-sub {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .media-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    .ctrl-btn.play {
      width: 44px;
      height: 44px;
      background: var(--text-primary);
      color: #0d0e11;
      font-weight: 700;
    }

    /* Alt Kayan Bilgi Bandı */
    .ticker-bar {
      height: 28px;
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 11px;
      color: var(--text-secondary);
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-badge {
      background: var(--bg-pill);
      color: var(--text-primary);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 10px;
      margin-right: 10px;
    }

    @media (max-width: 820px) {
      .main-grid {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
      html, body {
        overflow-y: auto;
      }
      .nav-tabs {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appRoot">
    <!-- Üst Menü -->
    <header class="top-nav">
      <div class="brand-group">
        <div class="brand-icon">///</div>
        <nav class="nav-tabs">
          <button class="nav-tab active" onclick="switchTab(this, 'Canlı Kokpit')">Live Map</button>
          <button class="nav-tab" onclick="switchTab(this, 'Motor & Şanzıman')">Telemetry</button>
          <button class="nav-tab" onclick="switchTab(this, 'Rota & Eğim')">Routes</button>
          <button class="nav-tab" onclick="switchTab(this, 'Yakıt & Verim')">Analytics</button>
        </nav>
      </div>

      <div class="top-actions">
        <div class="status-chip">
          <span class="dot green"></span>
          <span id="gpsStatus">GPS LOCK</span>
        </div>
        <div class="status-chip" id="clockDisplay">--:--</div>
        <button class="btn-fullscreen" id="fsBtn" onclick="toggleFullScreen()">
          <span>⛶</span> <span id="fsText">TAM EKRAN</span>
        </button>
      </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="main-grid">
      <!-- Sol Sütun -->
      <section class="left-col">
        <!-- Üst Özet Haplar -->
        <div class="pill-row">
          <div class="mini-pill"><span>430 HP</span><span>DXi 11</span></div>
          <div class="mini-pill"><span id="gearPill">12. VİTES</span><span>MANUEL</span></div>
          <div class="mini-pill"><span id="altPill">142 m</span><span>RAKIM</span></div>
          <div class="mini-pill"><span id="inclinePill">0.4°</span><span>EĞİM</span></div>
        </div>

        <!-- Hız ve Devir Kartları -->
        <div class="kpi-row">
          <div class="card kpi-card">
            <div class="kpi-header">
              <span class="dot green"></span>
              <span>ANLIK HIZ</span>
            </div>
            <div class="kpi-body">
              <span class="kpi-label">Seyir</span>
              <div>
                <span class="kpi-value" id="speedVal">0</span>
                <span class="kpi-unit">km/h</span>
              </div>
            </div>
          </div>

          <div class="card kpi-card">
            <div class="kpi-header">
              <span class="dot red"></span>
              <span>MOTOR DEVRİ</span>
            </div>
            <div class="kpi-body">
              <span class="kpi-label">RPM</span>
              <div>
                <span class="kpi-value" id="rpmVal">650</span>
                <span class="kpi-unit">rpm</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Performans & Verimlilik Grafiği -->
        <div class="card chart-card">
          <div class="chart-top">
            <div>
              <div class="chart-title">Operational Efficiency / Sürüş Verimliliği</div>
              <div class="chart-big-num" id="effVal">84.6 <span>%</span></div>
            </div>
            <span style="font-size: 11px; color: var(--text-secondary);">Target >80%</span>
          </div>
          <div class="chart-canvas-wrap">
            <canvas id="telemetryChart"></canvas>
          </div>
        </div>

        <!-- Alt İkili Araç Durum Kartları -->
        <div class="bottom-cards">
          <div class="card vehicle-card">
            <div class="vc-head">
              <div>
                <div class="vc-title">Premium 430</div>
                <div class="vc-sub" id="dateSub">AKTİF TELEMETRİ • HAT 01</div>
              </div>
              <span class="vc-arrow">↗</span>
            </div>

            <div class="truck-schematic">
              <svg width="160" height="44" viewBox="0 0 180 50" fill="none">
                <rect x="6" y="10" width="110" height="28" rx="4" stroke="#8c92a0" stroke-width="1.5" fill="rgba(255,255,255,0.03)"/>
                <path d="M120 14H154L168 25V38H120V14Z" stroke="#f2f4f8" stroke-width="1.5" fill="rgba(255,255,255,0.
