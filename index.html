<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kabin Kokpiti</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:'Space Mono',monospace;margin:0;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
.cockpit-wrapper{display:flex;flex-direction:column;width:100%;max-width:460px;background:#000;border:1px solid #1f1f22}
.map-widget{background:#050505;border-bottom:1px solid #222225;display:flex;flex-direction:column}
.map-widget-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#08080a;border-bottom:1px solid #1c1c1f;font-size:11px;letter-spacing:2px}
.map-actions{display:flex;gap:6px}
.mini-btn{background:#121214;color:#fff;border:1px solid #333338;padding:5px 8px;font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;text-decoration:none}
.map-frame-box{width:100%;height:170px;background:#000}
.map-frame-box iframe{width:100%;height:100%;border:0;filter:invert(92%) hue-rotate(180deg) contrast(105%) grayscale(30%)}
.stacked-menu{display:flex;flex-direction:column;width:100%}
.menu-strip{display:flex;align-items:center;gap:20px;width:100%;padding:18px 24px;border:none;border-bottom:1px solid #1a1a1d;text-align:left;text-decoration:none;color:#fff;font-family:inherit;font-size:15px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;cursor:pointer}
.menu-strip:nth-child(1){background:#09090b}
.menu-strip:nth-child(2){background:#0e0e11}
.menu-strip:nth-child(3){background:#131317}
.menu-strip:nth-child(4){background:#18181d}
.menu-strip:nth-child(5){background:#1d1d23}
.menu-strip:nth-child(6){background:#222229;border-bottom:none}
.menu-strip:active{background:#fff!important;color:#000!important}
.menu-strip:active svg{stroke:#000}
.menu-strip svg{width:22px;height:22px;stroke:#fff;stroke-width:1.8;fill:none;flex-shrink:0}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100;padding:16px;overflow-y:auto}
.header-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #27272a}
.header-bar h2{margin:0;font-size:15px;letter-spacing:3px;text-transform:uppercase}
.back-btn{background:#fff;color:#000;border:none;padding:10px 18px;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:2px;cursor:pointer}
.box{background:#0c0c0e;border:1px solid #27272a;padding:15px;margin-bottom:15px}
input{width:100%;padding:12px;background:#000;border:1px solid #3f3f46;color:#fff;font-family:inherit;margin-bottom:10px;font-size:14px}
.station-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.station-btn{background:#09090b;border:1px solid #27272a;color:#a1a1aa;padding:14px 8px;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:1.5px;cursor:pointer}
.station-btn.active{background:#fff;border-color:#fff;color:#000}
.touchpad-container{display:flex;gap:10px;margin-bottom:15px}
#touchpad-area{flex:1;height:180px;background:#050505;border:1px solid #3f3f46;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a1a1aa;font-size:12px;text-align:center;user-select:none;touch-action:none}
.scroll-panel{width:60px;display:flex;flex-direction:column;gap:10px}
.scroll-btn{flex:1;background:#121215;color:#fff;border:1px solid #3f3f46;font-size:18px;font-weight:bold;cursor:pointer}
.touchpad-btns{display:flex;gap:10px;margin-bottom:15px}
.touchpad-btns button{flex:1;padding:14px;background:#18181b;color:#fff;border:1px solid #3f3f46;font-family:inherit;font-weight:700;font-size:12px;letter-spacing:2px;cursor:pointer}
@media screen and (orientation:landscape){
.cockpit-wrapper{flex-direction:row;max-width:96vw;height:86vh}
.map-widget{flex:1.15;height:100%;border-bottom:none;border-right:1px solid #222225}
.map-frame-box{flex:1;height:auto}
.stacked-menu{flex:1;height:100%}
.menu-strip{flex:1;padding:0 24px}
.station-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="cockpit-wrapper">
<div class="map-widget">
<div class="map-widget-header">
<div><span>●</span> <span id="gps-status-text">GPS KONUMU</span></div>
<div class="map-actions">
<button type="button" class="mini-btn" onclick="locateUser()">YENİLE</button>
<a id="gmaps-external-link" href="https://maps.google.com" target="_blank" class="mini-btn">MAPS ↗</a>
<button type="button" class="mini-btn" onclick="openModal('maps-modal')">TAM EKRAN</button>
</div>
</div>
<div class="map-frame-box">
<iframe id="widgetMapFrame" src="https://www.openstreetmap.org/export/embed.html?bbox=26.0%2C36.0%2C45.0%2C42.0&layer=mapnik"></iframe>
</div>
</div>

<div class="stacked-menu">
<a href="https://debridui.com" target="_blank" class="menu-strip">
<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
<span>DEBRIDUI</span>
</a>
<button type="button" onclick="openModal('weather-modal')" class="menu-strip">
<svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
<span>YOL & HAVA</span>
</button>
<button type="button" onclick="openModal('touchpad-modal')" class="menu-strip">
<svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="7"></rect><line x1="12" y1="6" x2="12" y2="10"></line></svg>
<span>TOUCHPAD</span>
</button>
<button type="button" onclick="openModal('radio-modal')" class="menu-strip">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"></path></svg>
<span>RADYO</span>
</button>
<button type="button" onclick="openModal('maps-modal')" class="menu-strip">
<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
<span>HARİTA</span>
</button>
<button type="button" onclick="alert('GÜVENLİK KAMERASI İLERİDE EKLENECEK.')" class="menu-strip">
<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
<span>GÜVENLİK</span>
</button>
</div>
</div>

<div id="weather-modal" class="modal">
<div class="header-bar"><h2>YOL & HAVA</h2><button type="button" class="back-btn" onclick="closeModal('weather-modal')">GERİ</button></div>
<div class="box">
<button type="button" class="back-btn" style="width:100%;margin-bottom:12px" onclick="getLocationWeather()">KONUMUMU AL</button>
<div style="display:flex;gap:10px">
<input type="text" id="cityInput" placeholder="ŞEHİR YAZIN..." style="margin-bottom:0">
<button type="button" class="back-btn" onclick="getWeather()">GETİR</button>
</div>
</div>
<div class="box" id="weatherResult"><p style="color:#a1a1aa;font-size:12px">KONUM SEÇİN VEYA ŞEHİR YAZIN.</p></div>
</div>

<div id="touchpad-modal" class="modal">
<div class="header-bar"><h2>TOUCHPAD</h2><button type="button" class="back-btn" onclick="closeModal('touchpad-modal')">GERİ</button></div>
<div class="box">
<div class="touchpad-container">
<div id="touchpad-area"><strong>İMLEÇ ALANI</strong><p style="font-size:10px;color:#71717a">PARMAĞINIZI GEZDİRİN</p></div>
<div class="scroll-panel">
<button type="button" class="scroll-btn">▲</button>
<button type="button" class="scroll-btn">▼</button>
</div>
</div>
<div class="touchpad-btns">
<button type="button">SOL TIK</button>
<button type="button">GERİ</button>
</div>
<div style="display:flex;gap:8px">
<input type="text" id="remoteInput" placeholder="YAZI YAZIN..." style="margin-bottom:0">
<button type="button" class="back-btn" onclick="sendText()">GÖNDER</button>
</div>
</div>
</div>

<div id="maps-modal" class="modal">
<div class="header-bar"><h2>TAM HARİTA</h2><button type="button" class="back-btn" onclick="closeModal('maps-modal')">GERİ</button></div>
<div style="width:100%;height:calc(100vh - 90px);border:1px solid #27272a">
<iframe id="fullMapFrame" width="100%" height="100%" style="border:0;filter:invert(92%) hue-rotate(180deg) contrast(105%) grayscale(30%)" src="https://www.openstreetmap.org/export/embed.html?bbox=26.0%2C36.0%2C45.0%2C42.0&layer=mapnik"></iframe>
</div>
</div>

<div id="radio-modal" class="modal">
<div class="header-bar"><h2>GECE RADYOSU</h2><button type="button" class="back-btn" onclick="closeRadio()">GERİ</button></div>
<div class="box" style="text-align:center">
<div class="station-grid">
<button type="button" class="station-btn active" onclick="selectStation(this,'NIGHTRIDE FM','https://stream.nightride.fm/nightride.mp3')">NIGHTRIDE FM</button>
<button type="button" class="station-btn" onclick="selectStation(this,'DARKSYNTH','https://stream.nightride.fm/darksynth.mp3')">DARKSYNTH</button>
<button type="button" class="station-btn" onclick="selectStation(this,'CYBERPUNK','https://ice2.somafm.com/defcon-128-mp3')">CYBERPUNK</button>
<button type="button" class="station-btn" onclick="selectStation(this,'SPACE AMBIENT','https://ice2.somafm.com/spacestation-128-mp3')">SPACE AMBIENT</button>
</div>
<h3 id="current-station-title" style="letter-spacing:3px;font-size:16px">NIGHTRIDE FM</h3>
<p id="radio-status" style="color:#a1a1aa;font-size:11px;letter-spacing:2px;margin-bottom:15px">● YAYINA HAZIR</p>
<audio id="synthRadio" controls preload="none" src="https://stream.nightride.fm/nightride.mp3" style="width:100%;margin-bottom:15px;filter:invert(100%)"></audio>
<div style="display:flex;gap:12px;justify-content:center">
<button type="button" class="back-btn" style="flex:1" onclick="playRadio()">OYNAT ▶</button>
<button type="button" class="back-btn" style="flex:1;background:#18181b;color:#fff;border:1px solid #3f3f46" onclick="pauseRadio()">DURDUR ⏸</button>
</div>
</div>
</div>

<script>
function openModal(id){document.getElementById(id).style.display='block'}
function closeModal(id){document.getElementById(id).style.display='none'}
function closeRadio(){closeModal('radio-modal');pauseRadio()}
function locateUser(){
const s=document.getElementById('gps-status-text');
if(!navigator.geolocation){s.innerText="GPS YOK";return}
s.innerText="ARANIYOR...";
navigator.geolocation.getCurrentPosition(p=>{
const lat=p.coords.latitude,lon=p.coords.longitude,d=0.015;
const u=`https://www.openstreetmap.org/export/embed.html?bbox=${lon-d}%2C${lat-d}%2C${lon+d}%2C${lat+d}&layer=mapnik&marker=${lat}%2C${lon}`;
document.getElementById('widgetMapFrame').src=u;
document.getElementById('fullMapFrame').src=u;
document.getElementById('gmaps-external-link').href=`https://www.google.com/maps/search/?api=1&query=${lat},${lon}`;
s.innerText="GPS AKTİF";
},()=>{s.innerText="İZİN GEREKLİ"},{enableHighAccuracy:true});
}
window.addEventListener('load',locateUser);
function getLocationWeather(){
const r=document.getElementById('weatherResult');
if(!navigator.geolocation){r.innerHTML="DESTEKLENMİYOR.";return}
r.innerHTML="ALINIYOR...";
navigator.geolocation.getCurrentPosition(async p=>{
try{
const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`);
const d=await res.json();
r.innerHTML=`<h3>GPS KONUMU</h3><p style="font-size:20px">SICAKLIK: ${d.current.temperature_2m}°C</p><p>NEM: %${d.current.relative_humidity_2m} | RÜZGAR: ${d.current.wind_speed_10m} KM/S</p>`;
}catch(e){r.innerHTML="HATA OLUŞTU."}
},()=>{r.innerHTML="İZİN REDDEDİLDİ."});
}
async function getWeather(){
const c=document.getElementById('cityInput').value,r=document.getElementById('weatherResult');
if(!c)return;r.innerHTML="YÜKLENİYOR...";
try{
const g=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${c}&count=1&language=tr&format=json`)).json();
if(!g.results||!g.results.length){r.innerHTML="BULUNAMADI.";return}
const {latitude,longitude,name}=g.results[0];
const d=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m`)).json();
r.innerHTML=`<h3>${name.toUpperCase()}</h3><p style="font-size:20px">SICAKLIK: ${d.current.temperature_2m}°C</p><p>NEM: %${d.current.relative_humidity_2m} | RÜZGAR: ${d.current.wind_speed_10m} KM/S</p>`;
}catch(e){r.innerHTML="HATA OLUŞTU."}
}
function sendText(){const v=document.getElementById('remoteInput').value;if(v){alert("GÖNDERİLDİ: "+v);document.getElementById('remoteInput').value=''}}
function selectStation(btn,name,url){
document.querySelectorAll('.station-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
document.getElementById('current-station-title').innerText=name;
const st=document.getElementById('radio-status'),a=document.getElementById('synthRadio');
st.innerText="⏳ BAĞLANIYOR...";a.pause();a.src=url;
const p=a.play();
if(p!==undefined){p.then(()=>{st.innerText="● CANLI YAYINDA"}).catch(()=>{st.innerText="▶ OYNAT'A BASIN"})}
}
function playRadio(){const a=document.getElementById('synthRadio'),st=document.getElementById('radio-status');a.play().then(()=>{st.innerText="● CANLI YAYINDA"}).catch(()=>{st.innerText="⚠️ TEKRAR DENEYİN"})}
function pauseRadio(){document.getElementById('synthRadio').pause();document.getElementById('radio-status').innerText="⏸ DURAKLATILDI"}
</script>
</body>
</html>
