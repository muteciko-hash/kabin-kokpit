<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DARKLIGHT IIX // NOSTROMO ULTIMATE COCKPIT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-touch-fullscreen" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --fg:#28ff8c;
  --fg-bright:#4dff9e;
  --fg-dim:#19a358;
  --border:#1d8f52;
  --bg-core:#04120a;
  --bg-mid:#010804;
  --bg-edge:#000301;
  --glow-rgb:40,255,140;
}
.crt-screen.red-alert{
  --fg:#ff3333;
  --fg-bright:#ff5c5c;
  --fg-dim:#a81c1c;
  --border:#8f1818;
  --bg-core:#140303;
  --bg-mid:#080101;
  --bg-edge:#030000;
  --glow-rgb:255,51,51;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000301;color:var(--fg);font-family:'Share Tech Mono',monospace;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
.crt-screen{position:fixed;inset:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 48%, var(--bg-core) 0%, var(--bg-mid) 65%, var(--bg-edge) 100%);overflow:hidden;padding:6px 10px;display:flex;flex-direction:column;gap:4px;color:var(--fg);box-shadow:inset 0 0 80px rgba(0,0,0,0.98), inset 0 0 18px rgba(var(--glow-rgb),0.14);transition:filter 0.25s}
.crt-screen.dimmed{filter:brightness(0.55)}
.crt-glass-glare{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 12%, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 35%, transparent 60%),radial-gradient(ellipse at 50% 50%, transparent 65%, rgba(0,0,0,0.78) 100%);pointer-events:none;z-index:25}
.crt-scanlines{position:absolute;inset:0;background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 1.5px, rgba(0,0,0,0.42) 2.5px, rgba(0,0,0,0.48) 3px),repeating-linear-gradient(to right, rgba(var(--glow-rgb),0.02) 0px, rgba(var(--glow-rgb),0.02) 1px, transparent 1px, transparent 3px);pointer-events:none;z-index:24}
.crt-screen.power-off{animation:crtOff 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards}
@keyframes crtOff{0%{transform:scale(1,1);filter:brightness(1)}40%{transform:scale(1,0.005);filter:brightness(5) contrast(2)}70%{transform:scale(0.002,0.002);filter:brightness(10)}100%{transform:scale(0,0);filter:brightness(0);background:#000}}
.glow{text-shadow:0 0 4px rgba(var(--glow-rgb),0.85), 0 0 11px rgba(var(--glow-rgb),0.45)}
.box-glow{box-shadow:inset 0 0 12px rgba(var(--glow-rgb),0.09), 0 0 7px rgba(var(--glow-rgb),0.12)}

/* KITT TARAYICI */
.kitt-scanner{height:3px;width:100%;background:var(--bg-edge);position:relative;overflow:hidden;border-radius:2px;flex-shrink:0}
.kitt-beam{position:absolute;top:0;bottom:0;width:22%;background:linear-gradient(90deg, transparent, var(--fg), transparent);box-shadow:0 0 10px var(--fg);animation:kittSweep 2.4s ease-in-out infinite alternate}
.kitt-scanner.alert .kitt-beam{background:linear-gradient(90deg, transparent, #f59e0b, #ef4444, #f59e0b, transparent);box-shadow:0 0 14px #ef4444;animation-duration:0.65s}
@keyframes kittSweep{0%{left:0%}100%{left:78%}}

/* ÜST BAŞLIK */
.term-header{background:var(--fg);color:#020804;padding:2px 8px;font-weight:700;font-size:clamp(9px, 1.2vw, 12px);letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;border-radius:3px;box-shadow:0 0 14px rgba(var(--glow-rgb),0.45);z-index:10;flex-shrink:0;cursor:pointer;white-space:nowrap;overflow:hidden;gap:6px}
.header-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-datetime{display:flex;align-items:center;gap:8px;flex-shrink:0}
.header-date{font-size:clamp(9px, 1.15vw, 12px);font-weight:700;letter-spacing:0.8px}
.header-clock{font-family:'VT323',monospace;font-size:clamp(18px, 2.3vw, 25px);line-height:0.85;letter-spacing:1.5px;background:#020804;color:var(--fg-bright);padding:2px 6px;border-radius:3px}

/* PUSULA & RAKIM BANDI */
.nav-ribbon{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--bg-edge);border:1px solid var(--border);padding:2px 7px;border-radius:3px;font-size:clamp(8.5px, 1vw, 10.5px);z-index:10;flex-shrink:0}
.compass-box{flex:1;min-width:0;display:flex;align-items:center;gap:5px;overflow:hidden}
.compass-tape-wrap{flex:1;min-width:40px;height:13px;background:var(--bg-mid);border:1px solid var(--border);position:relative;overflow:hidden;display:flex;align-items:center}
.compass-center-mark{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#f59e0b;box-shadow:0 0 6px #f59e0b;z-index:3;transform:translateX(-50%)}
.compass-strip{white-space:nowrap;font-size:9px;letter-spacing:2.5px;color:var(--fg);position:absolute;left:50%;transform:translateX(-50%);transition:transform 0.4s ease}
.alt-badge{background:var(--bg-core);border:1px solid var(--fg);padding:1px 6px;border-radius:2px;font-weight:700;color:var(--fg-bright);white-space:nowrap;flex-shrink:0}

/* ANA MODÜL IZGARASI */
.term-grid{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0, 0.96fr) minmax(0, 1.38fr) minmax(0, 1.1fr);grid-template-rows:minmax(0, 1.62fr) minmax(0, 0.38fr);gap:5px;z-index:10}
.t-module{min-width:0;min-height:0;border:1px solid var(--border);background:rgba(2,10,6,0.78);padding:5px 7px;display:flex;flex-direction:column;justify-content:space-between;position:relative;border-radius:4px;overflow:hidden}
.crt-screen.red-alert .t-module{background:rgba(12,2,2,0.78)}
.t-mod-title{font-size:clamp(8px, 0.95vw, 10px);letter-spacing:0.9px;color:var(--fg);border-bottom:1px solid var(--border);padding-bottom:2px;margin-bottom:2px;display:flex;justify-content:space-between;font-weight:700;white-space:nowrap;overflow:hidden}

/* 1. SOL: HAVA & KÜRE */
.w-top-row{display:flex;justify-content:space-between;align-items:center;gap:4px}
.w-big-deg{font-family:'VT323',monospace;font-size:clamp(30px, 4.2vw, 46px);line-height:.82;color:var(--fg-bright);text-shadow:0 0 6px var(--fg)}
.wire-globe{width:34px;height:34px;border-radius:50%;border:1px solid var(--fg);position:relative;overflow:hidden;box-shadow:inset 0 0 8px rgba(var(--glow-rgb),0.35), 0 0 6px rgba(var(--glow-rgb),0.25);flex-shrink:0}
.globe-meridian{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(var(--glow-rgb),0.65);animation:globeSpin 6s linear infinite}
.globe-meridian:nth-child(2){animation-delay:-2s}
.globe-meridian:nth-child(3){animation-delay:-4s}
.globe-equator{position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(var(--glow-rgb),0.65)}
@keyframes globeSpin{0%{transform:scaleX(1)}50%{transform:scaleX(0.08)}100%{transform:scaleX(1)}}
.w-bars{display:flex;gap:4px;flex:1;min-height:22px;max-height:46px;align-items:flex-end;padding-top:2px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;height:100%}
.bar-track{width:100%;flex:1;border:1px solid var(--border);padding:1px;display:flex;align-items:flex-end;background:var(--bg-edge)}
.bar-fill{width:100%;background:repeating-linear-gradient(to top,var(--fg) 0px,var(--fg) 3px,var(--bg-core) 3px,var(--bg-core) 4px);transition:height .5s}
.bar-lbl{font-size:7px;color:var(--fg-dim)}
.w-search-row{display:flex;gap:3px;margin-top:2px}
.w-search-row input{flex:1;min-width:0;background:var(--bg-edge);border:1px solid var(--border);color:var(--fg);font-family:inherit;font-size:9px;padding:2px 4px;outline:none}
.w-search-row button{background:var(--bg-core);color:var(--fg);border:1px solid var(--fg);font-family:inherit;font-size:8px;padding:2px 5px;cursor:pointer;font-weight:700}

/* 2. ORTA: HIZ & MOTOR */
.speed-hero{display:flex;align-items:baseline;justify-content:space-between;background:var(--bg-edge);border:1px solid var(--border);padding:2px 7px;border-radius:3px}
.speed-num{font-family:'VT323',monospace;font-size:clamp(36px, 5vw, 54px);line-height:0.84;color:var(--fg-bright);letter-spacing:1.5px}
.speed-num.overspeed{color:#f59e0b;text-shadow:0 0 10px rgba(245,158,11,0.85)}
.speed-unit-col{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.speed-unit{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--fg)}
.speed-stats{font-size:7.5px;color:var(--fg-dim)}

.engine-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin:2px 0}
.eng-cell{background:var(--bg-edge);border:1px solid var(--border);padding:2px 3px;display:flex;flex-direction:column;gap:1px;min-width:0}
.eng-lbl{font-size:6.5px;color:var(--fg-dim);white-space:nowrap;overflow:hidden}
.eng-val{font-size:8.5px;font-weight:700;color:var(--fg);white-space:nowrap}
.eng-mini-bar{height:3px;background:var(--bg-core);width:100%}
.eng-mini-fill{height:100%;background:var(--fg);transition:width 0.3s}

.gforce-wrap{display:flex;align-items:center;gap:4px;font-size:7.5px;color:var(--fg-dim)}
.gforce-bar{flex:1;height:6px;border:1px solid var(--border);background:var(--bg-edge);position:relative}
.gforce-indicator{position:absolute;width:6px;height:100%;background:var(--fg);box-shadow:0 0 6px var(--fg);left:50%;transform:translateX(-50%);transition:left 0.1s}
.tacho-compact{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--border);padding-top:2px;gap:4px}
.tacho-mini-readout{display:flex;flex-direction:column;min-width:0}
.tacho-mini-lbl{font-size:6.8px;color:var(--fg-dim);white-space:now
