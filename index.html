<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kabin Kokpiti</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kabin Kokpiti">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: calc(10px + env(safe-area-inset-top));
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        .cockpit-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 460px;
            background: #000000;
            border: 1px solid #1f1f22;
            overflow: hidden;
        }

        /* Canlı Harita Widget (Minimalist Siyah Çerçeve) */
        .map-widget {
            background: #050505;
            border-bottom: 1px solid #222225;
            display: flex;
            flex-direction: column;
        }
        .map-widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #08080a;
            border-bottom: 1px solid #1c1c1f;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .map-widget-title {
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .map-actions { display: flex; gap: 6px; }
        .mini-btn {
            background: #121214;
            color: #ffffff;
            border: 1px solid #333338;
            padding: 5px 9px;
            font-family: inherit;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
        }
        .mini-btn:active { background: #ffffff; color: #000000; }
        .map-frame-box { width: 100%; height: 170px; position: relative; background: #000000; }
        .map-frame-box iframe { width: 100%; height: 100%; border: 0; filter: invert(92%) hue-rotate(180deg) contrast(105%) grayscale(30%); }

        /* Görseldeki Gibi Kademeli Yatay Şerit Menü */
        .stacked-menu {
            display: flex;
            flex-direction: column;
            width: 100%;
            background: #000000;
        }

        .menu-strip {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 20px 26px;
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            cursor: pointer;
            border-bottom: 1px solid #1a1a1d;
            transition: background-color 0.15s, padding-left 0.15s;
            position: relative;
        }

        /* Görseldeki katmanlı/kademeli ton ve genişlik geçişi */
        .menu-strip:nth-child(1) { background-color: #09090b; }
        .menu-strip:nth-child(2) { background-color: #0e0e11; }
        .menu-strip:nth-child(3) { background-color: #131317; }
        .menu-strip:nth-child(4) { background-color: #18181d; }
        .menu-strip:nth-child(5) { background-color: #1d1d23; }
        .menu-strip:nth-child(6) { background-color: #222229; border-bottom: none; }

        .menu-strip:active {
            background-color: #ffffff !important;
            color: #000000 !important;
            padding-left: 34px;
        }
        .menu-strip:active svg {
            stroke: #000000;
        }

        .menu-strip svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* Modallar (Siyah & Beyaz Minimalist Tema) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; z-index: 100; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top)); overflow-y: auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid #27272a; }
        .header-bar h2 { margin: 0; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; color: #ffffff; }
        .back-btn { background: #ffffff; color: #000000; border: none; padding: 10px 18px; font-family: inherit; font-weight: 700; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
        .back-btn:active { background: #a1a1aa; }
        .box { background: #0c0c0e; border: 1px solid #27272a; padding: 16px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; background: #000000; border: 1px solid #3f3f46; color: #ffffff; font-family: inherit; margin-bottom: 10px; font-size: 14px; }
        
        .station-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .station-btn { background: #09090b; border: 1px solid #27272a; color: #a1a1aa; padding: 14px 10px; font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; text-align: center; }
        .station-btn.active { background: #ffffff; border-color: #ffffff; color: #000000; }

        .touchpad-container { display: flex; gap: 10px; margin-bottom: 15px; }
        #touchpad-area { flex: 1; height: 200px; background: #050505; border: 1px solid #3f3f46; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #a1a1aa; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; user-select: none; touch-action: none; }
        .scroll-panel { width: 60px; display: flex; flex-direction: column; gap: 10px; }
        .scroll-btn { flex: 1; background: #121215; color: #ffffff; border: 1px solid #3f3f46; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .scroll-btn:active { background: #ffffff; color: #000000; }
        .touchpad-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .touchpad-btns button { flex: 1; padding: 14px; background: #18181b; color: #ffffff; border: 1px solid #3f3f46; font-family: inherit; font-weight: 700; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
        .touchpad-btns button:active { background: #ffffff; color: #000000; }

        /* Yatay Ekran (ASUS Monitör 16:9) Bölünmüş Kokpit Düzeni */
        @media screen and (orientation: landscape) {
            body { padding: 10px 20px; }
            .cockpit-wrapper { flex-direction: row; max-width: 96vw; height: 86vh; }
            .map-widget { flex: 1.15; height: 100%; border-bottom: none; border-right: 1px solid #222225; }
            .map-frame-box { flex: 1; height: auto; }
            .stacked-menu { flex: 1; height: 100%; justify-content: space-between; }
            .menu-strip { flex: 1; padding: 0 24px; }
            .station-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>
    <div class="cockpit-wrapper">
        <!-- Canlı GPS Harita Widget -->
        <div class="map-widget">
            <div class="map-widget-header">
                <div class="map-widget-title"><span>●</span> <span id="gps-status-text">GPS KONUMU</span></div>
                <div class="map-actions">
                    <button class="mini-btn" onclick="locateUser()">YENİLE</button>
                    <a id="gmaps-external-link" href="https://maps.google.com" target="_blank" class="mini-btn">MAPS ↗</a>
                    <button class="mini-btn" onclick="openMaps()">TAM EKRAN</button>
                </div>
            </div>
            <div class="map-frame-box">
                <iframe id="widgetMapFrame" src="https://www.openstreetmap.org/export/embed.html?bbox=26.0%2C36.0%2C45.0%2C42.0&layer=mapnik"></iframe>
            </div>
        </div>

        <!-- Görseldeki Gibi Minimalist Siyah-Beyaz Şerit Menü -->
        <div class="stacked-menu" id="main-menu">
            <a href="https://debridui.com" target="_blank" class="menu-strip">
                <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <span>DEBRIDUI</span>
            </a>

            <div onclick="openWeather()" class="menu-strip">
                <svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
                <span>YOL & HAVA</span>
            </div>

            <div onclick="openTouchpad()" class="menu-strip">
                <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="7"></rect><line x1="12" y1="6" x2="12" y2="10"></line></svg>
                <span>TOUCHPAD</span>
            </div>

            <div onclick="openRadio()" class="menu-strip">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10
