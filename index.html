<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kabin Kokpiti</title>
    
    <!-- PWA Manifest Bağlantısı -->
    <link rel="manifest" href="/manifest.json">

    <!-- iOS Tam Ekran Komutları -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kabin Kokpiti">

    <style>
        body {
            background: linear-gradient(135deg, #000000 0%, #18051d 50%, #050b14 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            color: #f0f9ff;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(236, 72, 153, 0.8), 0 0 30px rgba(59, 130, 246, 0.5);
            font-weight: 800;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .card {
            background-color: rgba(22, 22, 28, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            transition: transform 0.1s, background-color 0.2s, border-color 0.2s;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .card:active {
            transform: scale(0.95);
            background-color: rgba(236, 72, 153, 0.6);
            border-color: rgba(236, 72, 153, 0.9);
        }

        .card span {
            display: block;
            font-size: 30px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.7));
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96);
            z-index: 100;
            padding: 15px;
            padding-top: calc(15px + env(safe-area-inset-top));
            box-sizing: border-box;
            overflow-y: auto;
            backdrop-filter: blur(15px);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: #d1d5db;
        }

        .back-btn {
            background: #ec4899;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .box {
            background: rgba(22, 22, 24, 0.9);
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #09090b;
            border: 1px solid #475569;
            color: white;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* Radyo İstasyon Butonları */
        .station-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .station-btn {
            background: #18181b;
            border: 1px solid #3f3f46;
            color: #e4e4e7;
            padding: 14px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .station-btn.active {
            background: rgba(59, 130, 246, 0.25);
            border-color: #3b82f6;
            color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .touchpad-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #touchpad-area {
            flex: 1;
            height: 200px;
            background: #09090b;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            user-select: none;
            touch-action: none;
            box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.3);
        }
